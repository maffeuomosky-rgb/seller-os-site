name: Patch Seller OS checkout CTA

on:
  push:
    branches:
      - seller-checkout-host-parity
    paths:
      - CHECKOUT_PATCH_TRIGGER.txt

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Activate checkout in existing homepage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path("index.html")
          s=p.read_text(encoding="utf-8")

          if '€49' not in s or 'content:"€79"' not in s:
              raise SystemExit("Pricing invariant failed")
          if 'id="seller-os-production-routes"' not in s:
              raise SystemExit("Production routes block not found")

          style='''<style id="seller-os-checkout-live">
          .checkout-active{width:100%;min-height:52px;border:0;border-radius:12px;background:#10131A!important;color:#fff!important;font-weight:750!important;cursor:pointer!important;opacity:1!important;pointer-events:auto!important}
          .checkout-active:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(16,19,26,.14)}
          .checkout-live-note{color:#659A00!important;font-weight:700!important}
          </style>'''
          if 'id="seller-os-checkout-live"' not in s:
              s=s.replace('</head>',style+'</head>',1)

          script='''<script id="seller-os-production-routes">
          (function(){
            const routeMap={'contatti':'/contatti','termini':'/termini','privacy':'/privacy','rimborsi':'/rimborsi'};

            document.addEventListener('click',function(e){
              const footer=e.target.closest('.site-footer button');
              if(footer){
                const url=routeMap[(footer.textContent||'').trim().toLowerCase()];
                if(url){
                  e.preventDefault();
                  e.stopPropagation();
                  e.stopImmediatePropagation();
                  window.location.href=url;
                  return;
                }
              }
              const checkout=e.target.closest('.checkout-active');
              if(checkout){
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                window.location.href='/checkout.html';
              }
            },true);

            function activateCheckout(){
              document.querySelectorAll('.checkout-disabled').forEach(function(btn){
                btn.disabled=false;
                btn.removeAttribute('disabled');
                btn.classList.remove('checkout-disabled');
                btn.classList.add('checkout-active');
                btn.innerHTML='Vai al checkout <span aria-hidden="true">→</span>';
              });
              document.querySelectorAll('.cart-notice').forEach(function(el){
                el.textContent='PayPal o bonifico · consegna digitale dopo la verifica del pagamento';
              });
              document.querySelectorAll('.pricing-reassurance small').forEach(function(el){
                el.textContent='Checkout attivo · PayPal o bonifico';
                el.classList.add('checkout-live-note');
              });
            }

            activateCheckout();
            setTimeout(activateCheckout,200);
            setTimeout(activateCheckout,700);
            new MutationObserver(activateCheckout).observe(document.body,{childList:true,subtree:true});
          })();
          </script>'''

          pattern=r'<script id="seller-os-production-routes">[\s\S]*?</script>'
          if not re.search(pattern,s):
              raise SystemExit("Unable to isolate routes block")
          s=re.sub(pattern,script,s,count=1)

          if "window.location.href='/checkout.html'" not in s:
              raise SystemExit("Checkout route missing after patch")
          if '€49' not in s or 'content:"€79"' not in s:
              raise SystemExit("Pricing changed unexpectedly")

          p.write_text(s,encoding="utf-8")
          print("Seller OS homepage checkout activated")
          PY

      - name: Commit homepage patch
        shell: bash
        run: |
          git config user.name "seller-os-release-bot"
          git config user.email "seller.os001@gmail.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No homepage changes"
            exit 0
          fi
          git commit -m "checkout: activate homepage checkout CTA"
          git push
