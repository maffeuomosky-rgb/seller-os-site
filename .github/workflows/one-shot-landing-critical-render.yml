name: One-shot Seller OS landing critical render fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'chore: run one-shot landing critical render fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make critical landing content visible without JS
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          marker = 'id="seller-os-critical-render-fallback"'
          if marker in html:
              print("Fallback already present")
              raise SystemExit(0)

          fallback = """<style id="seller-os-critical-render-fallback">
          /* Production safety: critical above-the-fold content must not depend on JS startup */
          .hero-copy>h1,
          .hero-copy>p,
          .hero-copy>.hero-actions,
          .hero-copy>.reassurance,
          .hero-product>div{
            opacity:1!important;
            transform:none!important;
          }
          </style>"""

          if "</head>" not in html:
              raise RuntimeError("Closing </head> not found")

          html = html.replace("</head>", fallback + "</head>", 1)
          path.write_text(html, encoding="utf-8")

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: ensure Seller OS landing renders critical content immediately"
          git push
