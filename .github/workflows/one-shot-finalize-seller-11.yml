name: Finalize Seller OS legal identity

on:
  push:
    branches: [main]
    paths:
      - README.md

permissions:
  contents: write

jobs:
  finalize-legal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace provisional legal identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements=[
            (
              "Prima dell’apertura delle vendite verranno completati i dati identificativi del venditore richiesti dalla normativa applicabile",
              "Il soggetto che commercializza Seller OS è Matteo Maffezzoli. Per comunicazioni relative all’acquisto e all’utilizzo del prodotto puoi scrivere a seller.os001@gmail.com"
            ),
            (
              "Il titolare del trattamento sarà il soggetto che commercializza Seller OS. I dati identificativi completi saranno inseriti prima dell’apertura delle vendite. Per richieste privacy puoi scrivere a seller.os001@gmail.com",
              "Il titolare del trattamento è Matteo Maffezzoli. Per richieste relative alla privacy puoi scrivere a seller.os001@gmail.com"
            ),
            (
              "Titolare e dati legali da completare · Email privacy: seller.os001@gmail.com",
              "Titolare: Matteo Maffezzoli · Email privacy: seller.os001@gmail.com"
            ),
            (
              "Email privacy: seller.os001@gmail.com · informazioni commerciali definitive da completare prima dell’attivazione delle vendite",
              "Titolare: Matteo Maffezzoli · Email privacy: seller.os001@gmail.com"
            ),
          ]

          changed=0
          for name in ["index.html","termini.html","privacy.html"]:
            p=Path(name)
            if not p.exists():
              continue
            s=p.read_text(encoding="utf-8")
            before=s
            for old,new in replacements:
              s=s.replace(old,new)
            if s!=before:
              p.write_text(s,encoding="utf-8")
              changed+=1
              print("updated",name)

          if changed==0:
            raise SystemExit("No provisional legal identity found")
          PY

      - name: Commit legal identity
        shell: bash
        run: |
          git config user.name "seller-os-release-bot"
          git config user.email "seller.os001@gmail.com"
          git add index.html termini.html privacy.html
          git commit -m "chore: finalize Seller OS legal identity"
          git push
