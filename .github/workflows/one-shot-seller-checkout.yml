name: One-shot Seller OS checkout from HOST OS 1.2

on:
  push:
    branches: [main]
    paths:
      - README.md

permissions:
  contents: write

jobs:
  port-checkout:
    if: github.event.head_commit.message != 'feat: port HOST OS checkout architecture to Seller OS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Port frozen HOST OS checkout architecture
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/host-os-ref
          git clone --depth 1 https://github.com/maffeuomosky-rgb/host-os-site.git /tmp/host-os-ref
          cd /tmp/host-os-ref
          git fetch --depth 1 origin 2c424fb164056ec9220778b4674167eeb50359bd
          git checkout 2c424fb164056ec9220778b4674167eeb50359bd
          cd "$GITHUB_WORKSPACE"

          python - <<'PY'
          from pathlib import Path
          import shutil, json, re

          src = Path('/tmp/host-os-ref')
          root = Path('.')

          copy_files = [
              'checkout.html','checkout.css','checkout.js',
              'ordine.html','ordine.js',
              'admin.html','admin.js',
              'env.example','package.json',
              'README_SETUP_CHECKOUT.md','README_SETUP_PAYPAL_LINK.md',
              'CHECKOUT_TEST_PLAN.md','PRIVATE_PRODUCT_SETUP.md',
              'scripts/upload-product.mjs',
              'db/schema.sql',
              'lib/admin-auth.js','lib/core.js','lib/db.js','lib/delivery.js',
              'lib/email.js','lib/http.js','lib/payment-links.js','lib/paypal.js',
              'lib/product.js','lib/rate-limit.js',
              'api/admin-action.js','api/admin-login.js','api/admin-orders.js',
              'api/admin-session.js','api/bank-notify.js','api/config.js',
              'api/download.js','api/health.js','api/order-download.js',
              'api/order-status.js','api/orders.js','api/paypal-link-notify.js',
              'tests/core.test.js','tests/payment-links.test.js','tests/schema.test.js',
          ]

          for rel in copy_files:
              a = src / rel
              if not a.exists():
                  raise SystemExit(f'Missing HOST OS reference file: {rel}')
              b = root / rel
              b.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(a, b)

          replacements = [
              ('host_orders', 'seller_orders'),
              ('host_webhook_events', 'seller_webhook_events'),
              ('hostos_', 'selleros_'),
              ('host-os-1-2', 'seller-os-1-1'),
              ('HOS-', 'SEL-'),
              ('HOST_OS_CUSTOMER_PACK_PRO_v1.2.zip', 'SELLER_OS_1.1_CUSTOMER_PACK_DEFINITIVO.zip'),
              ('HOST_OS_1.2_CUSTOMER_PACK_FINAL.zip', 'SELLER_OS_1.1_CUSTOMER_PACK_DEFINITIVO.zip'),
              ('00_APRI_HOST_OS.html', '00_APRI_SELLER_OS.html'),
              ('https://host-os-site.vercel.app', 'https://seller-os-site-eight.vercel.app'),
              ('https://hostos.it', 'https://seller-os-site-eight.vercel.app'),
              ('support@hostos.it', 'seller.os001@gmail.com'),
              ('HOST OS 1.3.0', 'Seller OS 1.1'),
              ('HOST OS 1.3', 'Seller OS 1.1'),
              ('HOST OS 1.2', 'Seller OS 1.1'),
              ('HOST OS', 'Seller OS'),
              ('host-os-checkout', 'seller-os-checkout'),
          ]

          text_suffixes = {'.html','.css','.js','.md','.txt','.json','.sql','.example'}
          for rel in copy_files:
              p = root / rel
              if p.suffix.lower() not in text_suffixes and p.name != 'env.example':
                  continue
              s = p.read_text(encoding='utf-8')
              for old,new in replacements:
                  s = s.replace(old,new)
              p.write_text(s,encoding='utf-8')

          # Seller-specific checkout HTML
          p=root/'checkout.html'
          s=p.read_text(encoding='utf-8')
          s=s.replace('<link rel="stylesheet" href="styles.css">','')
          s=s.replace('assets/symbol.png','og-seller-os.png')
          s=s.replace(
              '<a class="co-brand" href="index.html" aria-label="Seller OS"><img src="assets/logo_light.png" alt="Seller OS"></a>',
              '<a class="co-brand co-brand-text" href="index.html" aria-label="Seller OS">SELLER <strong>OS</strong></a>'
          )
          s=s.replace('assets/host_os_box_1_2.png','og-seller-os.png')
          s=s.replace('Control center per affitti brevi','Il sistema operativo per chi vende online')
          s=s.replace('Licenza personale · pagamento una tantum','Licenza personale · pagamento una tantum')
          p.write_text(s,encoding='utf-8')

          for name in ['ordine.html','admin.html']:
              p=root/name
              s=p.read_text(encoding='utf-8')
              s=s.replace('<link rel="stylesheet" href="styles.css">','')
              s=s.replace('assets/symbol.png','og-seller-os.png')
              s=s.replace(
                  '<a class="co-brand" href="index.html"><img src="assets/logo_light.png" alt="Seller OS"></a>',
                  '<a class="co-brand co-brand-text" href="index.html" aria-label="Seller OS">SELLER <strong>OS</strong></a>'
              )
              p.write_text(s,encoding='utf-8')

          # Seller green identity for checkout/admin/order
          p=root/'checkout.css'
          s=p.read_text(encoding='utf-8')
          color_repl=[
              ('--co-accent:#27dcd8','--co-accent:#A8F703'),
              ('--co-accent-dark:#0b7f8d','--co-accent-dark:#659A00'),
              ('--co-soft:#edfafa','--co-soft:#F5FDE7'),
              ('#087d86','#6A9800'),('#38d7da','#A8F703'),
              ('rgba(39,220,216,.12)','rgba(168,247,3,.14)'),
              ('#25d9d7','#A8F703'),('#f0fcfc','#F8FDEB'),
              ('rgba(39,220,216,.09)','rgba(168,247,3,.10)'),
              ('#20cfd0','#80BD00'),('#38e2dc','#B7FF28'),
              ('#23cfd5','#8FD600'),('rgba(22,181,192,.18)','rgba(126,183,0,.18)'),
              ('#08a4aa','#6F9F00'),('#0a6572','#587D00'),
              ('#27d7d5','#A8F703'),('#edfafa','#F5FDE7'),
              ('rgba(19,184,204,.48)','rgba(126,183,0,.48)'),
              ('#def8f6','#F0FBD8'),('#067b82','#5F8C00'),
              ('#0b606b','#557900'),('#0a7c83','#659A00'),
          ]
          for old,new in color_repl:
              s=s.replace(old,new)
          s += """
.co-brand-text{display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:#10131A;font-size:19px;font-weight:850;letter-spacing:-.045em}
.co-brand-text strong{color:#79B900;font-weight:900}
.co-summary-visual img{border-radius:14px}
.checkout-live-note{color:#659A00;font-weight:700}
"""
          p.write_text(s,encoding='utf-8')

          # Package script aligned to files actually used in link-mode Production Master.
          pkg=json.loads((root/'package.json').read_text(encoding='utf-8'))
          pkg['name']='seller-os-checkout'
          pkg['version']='1.1.0'
          checks=[
              'checkout.js','ordine.js','admin.js',
              'lib/core.js','lib/http.js','lib/db.js','lib/paypal.js',
              'lib/payment-links.js','lib/email.js','lib/delivery.js',
              'lib/admin-auth.js','lib/product.js','lib/rate-limit.js',
              'api/config.js','api/orders.js','api/order-status.js',
              'api/bank-notify.js','api/paypal-link-notify.js',
              'api/download.js','api/admin-login.js','api/admin-session.js',
              'api/admin-orders.js','api/admin-action.js','api/health.js',
              'scripts/upload-product.mjs','api/order-download.js'
          ]
          pkg['scripts']['check']=' && '.join(f'node --check {x}' for x in checks)
          (root/'package.json').write_text(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Seller production environment template — never contains real secrets.
          env=(root/'env.example').read_text(encoding='utf-8')
          env=env.replace('PRODUCT_BLOB_PATHNAME=products/SELLER_OS_1.1_CUSTOMER_PACK_DEFINITIVO.zip',
                          'PRODUCT_BLOB_PATHNAME=SELLER_OS_1.1_CUSTOMER_PACK_DEFINITIVO.zip')
          env=env.replace('EMAIL_FROM=Seller OS <noreply@hostos.it>',
                          'EMAIL_FROM=Seller OS <sender@dominio-verificato.it>')
          (root/'env.example').write_text(env,encoding='utf-8')

          # Preserve Seller legal clean URLs while adding HOST OS security headers.
          vercel = {
            "cleanUrls": True,
            "trailingSlash": False,
            "headers": [
              {"source":"/(.*)","headers":[
                {"key":"X-Content-Type-Options","value":"nosniff"},
                {"key":"Referrer-Policy","value":"strict-origin-when-cross-origin"},
                {"key":"Permissions-Policy","value":"camera=(), microphone=(), geolocation=()"}
              ]},
              {"source":"/api/(.*)","headers":[{"key":"Cache-Control","value":"no-store, max-age=0"}]},
              {"source":"/admin(.*)","headers":[
                {"key":"Cache-Control","value":"no-store, max-age=0"},
                {"key":"X-Robots-Tag","value":"noindex, nofollow"}
              ]},
              {"source":"/ordine(.*)","headers":[
                {"key":"Cache-Control","value":"no-store, max-age=0"},
                {"key":"X-Robots-Tag","value":"noindex, nofollow"}
              ]}
            ],
            "rewrites":[
              {"source":"/contatti","destination":"/contatti.html"},
              {"source":"/termini","destination":"/termini.html"},
              {"source":"/privacy","destination":"/privacy.html"},
              {"source":"/rimborsi","destination":"/rimborsi.html"}
            ],
            "$schema":"https://openapi.vercel.sh/vercel.json"
          }
          (root/'vercel.json').write_text(json.dumps(vercel,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Homepage: preserve the current React design and only activate its existing cart checkout.
          p=root/'index.html'
          s=p.read_text(encoding='utf-8')

          checkout_style = """<style id="seller-os-checkout-live">
.checkout-active{width:100%;min-height:52px;border:0;border-radius:12px;background:#10131A!important;color:#fff!important;font-weight:750!important;cursor:pointer!important;opacity:1!important}
.checkout-active:hover{transform:translateY(-1px)}
</style>"""
          if 'id="seller-os-checkout-live"' not in s:
              s=s.replace('</head>',checkout_style+'</head>',1)

          new_script = r'''<script id="seller-os-production-routes">
(function(){
  const routeMap={
    'contatti':'/contatti',
    'termini':'/termini',
    'privacy':'/privacy',
    'rimborsi':'/rimborsi'
  };

  document.addEventListener('click',function(e){
    const footer=e.target.closest('.site-footer button');
    if(footer){
      const url=routeMap[(footer.textContent||'').trim().toLowerCase()];
      if(url){
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        window.location.href=url;
        return;
      }
    }

    const checkout=e.target.closest('.checkout-active');
    if(checkout){
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      window.location.href='/checkout.html';
    }
  },true);

  function activateCheckout(){
    document.querySelectorAll('.checkout-disabled').forEach(function(btn){
      btn.disabled=false;
      btn.classList.remove('checkout-disabled');
      btn.classList.add('checkout-active');
      btn.innerHTML='Vai al checkout <span aria-hidden="true">→</span>';
    });

    document.querySelectorAll('.cart-notice').forEach(function(el){
      el.textContent='PayPal o bonifico · consegna digitale dopo la verifica del pagamento';
    });

    document.querySelectorAll('.pricing-reassurance small').forEach(function(el){
      el.textContent='Checkout attivo · PayPal o bonifico';
      el.classList.add('checkout-live-note');
    });
  }

  activateCheckout();
  setTimeout(activateCheckout,250);
  setTimeout(activateCheckout,800);
  new MutationObserver(activateCheckout).observe(document.body,{childList:true,subtree:true});
})();
</script>'''

          pattern=r'<script id="seller-os-production-routes">.*?</script>'
          if not re.search(pattern,s,flags=re.S):
              raise SystemExit('seller-os-production-routes block not found; refusing homepage patch')
          s=re.sub(pattern,new_script,s,count=1,flags=re.S)

          if '€49' not in s or 'content:"€79"' not in s:
              raise SystemExit('Seller pricing invariant failed: expected €49 with €79 crossed out')
          p.write_text(s,encoding='utf-8')

          # Legal copy aligned with manual payment verification.
          q=root/'rimborsi.html'
          if q.exists():
              t=q.read_text(encoding='utf-8')
              t=t.replace(
                  'L’accesso viene reso disponibile immediatamente dopo il pagamento secondo le modalità indicate nella pagina di conferma dell’ordine',
                  'L’accesso viene reso disponibile dopo la verifica del pagamento secondo le modalità indicate nella pagina ordine'
              )
              q.write_text(t,encoding='utf-8')

          q=root/'termini.html'
          if q.exists():
              t=q.read_text(encoding='utf-8')
              t=t.replace(
                  'Dopo il pagamento l’acquirente riceve le istruzioni per accedere al prodotto e creare la propria copia di Seller OS',
                  'Dopo la verifica del pagamento l’acquirente riceve le istruzioni per accedere al prodotto e creare la propria copia di Seller OS'
              )
              q.write_text(t,encoding='utf-8')

          # Production documentation.
          (root/'README_PRODUCTION.md').write_text("""# Seller OS 1.1 — Checkout Production Architecture

Seller OS usa la stessa infrastruttura commerciale congelata di HOST OS 1.2, mantenendo prodotto, branding, Customer Pack e logica Seller separati.

## Flusso
Landing → Carrello → Checkout → Ordine → PayPal link o Bonifico → PAGAMENTO_DA_VERIFICARE → verifica manuale admin → PAGATO/CONSEGNATO → e-mail → download protetto

## Prezzo
- €49 una tantum
- €79 prezzo precedente/promozionale barrato
- nessun abbonamento

## Stati
- IN_ATTESA_PAGAMENTO
- PAGAMENTO_DA_VERIFICARE
- PAGATO
- CONSEGNATO
- ANNULLATO
- RIMBORSATO

## Delivery
- Customer Pack fuori dagli asset pubblici
- Vercel Blob privato
- link tokenizzato
- validità 7 giorni
- massimo 5 download

## Stack
- Vercel
- PostgreSQL/Neon
- PayPal link con verifica manuale
- Bonifico con verifica manuale
- Resend
- Admin protetto
- Vercel Blob privato

Vedi README_SETUP_CHECKOUT.md per configurazione e QA.
""",encoding='utf-8')

          # Ensure Customer Pack can never be accidentally committed.
          gi=root/'.gitignore'
          old=gi.read_text(encoding='utf-8') if gi.exists() else ''
          for line in [
              '.env','.env.*','!.env.example','node_modules/','.vercel/','*.log',
              'private-products/','SELLER_OS_1.1_CUSTOMER_PACK_DEFINITIVO.zip'
          ]:
              if line not in old.splitlines():
                  old += ('\n' if old and not old.endswith('\n') else '') + line + '\n'
          gi.write_text(old,encoding='utf-8')

          # Remove the temporary workflow in the same generated commit.
          wf=root/'.github/workflows/one-shot-seller-checkout.yml'
          if wf.exists():
              wf.unlink()

          print('Seller OS checkout port prepared')
          PY

      - name: Validate syntax and tests
        shell: bash
        run: |
          npm install --ignore-scripts
          npm run check
          npm test

      - name: Commit Seller OS checkout
        shell: bash
        run: |
          git config user.name "seller-os-release-bot"
          git config user.email "seller.os001@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat: port HOST OS checkout architecture to Seller OS"
          git push
