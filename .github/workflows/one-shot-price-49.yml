name: Seller OS price patch

on: [push]

permissions:
  contents: write

jobs:
  patch-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch price
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          s2 = s.replace("€39", "€49")
          s2 = s2.replace(r"\u20AC39", r"\u20AC49")
          s2 = s2.replace("n*39", "n*49")

          if 'id="seller-price-promo-49"' not in s2:
              css = '<style id="seller-price-promo-49">.cta-price{display:inline-flex!important;align-items:center;gap:8px}.cta-price::before{content:"€79";color:rgba(255,255,255,.68);font-size:.78em;font-weight:450;text-decoration:line-through;text-decoration-thickness:1.5px}.price{display:flex!important;align-items:baseline;gap:18px;flex-wrap:wrap}.price::before{content:"€79";color:var(--muted);font-size:30px;line-height:1;font-weight:450;letter-spacing:-.03em;text-decoration:line-through;text-decoration-thickness:2px}.footer-product-link small::before{content:"€79";margin-right:7px;color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}@media(max-width:767px){.price{gap:12px}.price::before{font-size:24px}.cta-price{gap:6px}}</style>'
              s2 = s2.replace("</head>", css + "</head>", 1)

          if s2 != s:
              p.write_text(s2, encoding="utf-8")

          tp = Path("termini.html")
          if tp.exists():
              t = tp.read_text(encoding="utf-8")
              t2 = t.replace("€39", "€49")
              if t2 != t:
                  tp.write_text(t2, encoding="utf-8")
          PY

      - name: Commit if changed
        run: |
          if git diff --quiet -- index.html termini.html; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "seller-os-release-bot"
          git config user.email "seller.os001@gmail.com"
          git add index.html termini.html
          git commit -m "chore: set Seller OS price to 49"
          git push
