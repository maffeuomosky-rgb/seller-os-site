name: Temporary Seller OS checkout patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-checkout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Activate production checkout bridge
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          marker = 'id="seller-os-checkout-production-bridge"'
          if marker in html:
              print("Production checkout bridge already present")
              raise SystemExit(0)

          bridge = r'''
          <style id="seller-os-checkout-production-style">
            .checkout-disabled.seller-checkout-live{
              background:var(--green)!important;
              color:var(--ink)!important;
              cursor:pointer!important;
              opacity:1!important;
              transition:transform .18s ease,filter .18s ease!important
            }
            .checkout-disabled.seller-checkout-live:hover{
              transform:translateY(-1px);
              filter:brightness(.98)
            }
          </style>
          <script id="seller-os-checkout-production-bridge">
          (function(){
            function activateProductionCheckout(){
              document.querySelectorAll('.checkout-disabled').forEach(function(btn){
                if(btn.disabled) btn.disabled = false;
                btn.removeAttribute('disabled');
                btn.setAttribute('aria-disabled','false');
                btn.classList.add('seller-checkout-live');
              });

              document.querySelectorAll('.cart-notice').forEach(function(el){
                el.textContent = 'Pagamento una tantum · PayPal o bonifico · consegna protetta dopo verifica del pagamento';
              });

              document.querySelectorAll('.pricing-reassurance small').forEach(function(el){
                el.textContent = 'PayPal o bonifico · pagamento una tantum';
              });
            }

            document.addEventListener('click', function(event){
              var button = event.target.closest('.checkout-disabled');
              if(!button) return;
              event.preventDefault();
              event.stopPropagation();
              event.stopImmediatePropagation();
              window.location.href = '/checkout';
            }, true);

            var observer = new MutationObserver(activateProductionCheckout);
            observer.observe(document.documentElement, {
              childList:true,
              subtree:true,
              attributes:true,
              attributeFilter:['disabled']
            });

            activateProductionCheckout();
            setTimeout(activateProductionCheckout,100);
            setTimeout(activateProductionCheckout,650);
          })();
          </script>
          '''

          closing = "</body>"
          if closing not in html:
              raise SystemExit("ERROR: </body> not found in index.html")

          html = html.replace(closing, bridge + "\n" + closing, 1)
          path.write_text(html, encoding="utf-8")
          print("Production checkout bridge added")
          PY

      - name: Commit production checkout activation
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index change required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: activate Seller OS checkout from landing"
          git push
