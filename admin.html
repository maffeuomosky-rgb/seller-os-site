<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Ordini | Seller OS Admin</title><link rel="icon" href="og-seller-os.png"><link rel="stylesheet" href="checkout.css"></head><body><div class="co-shell"><header class="co-header"><div class="co-header-inner"><a class="co-brand co-brand-text" href="index.html" aria-label="Seller OS">SELLER <strong>OS</strong></a><span class="co-kicker">ADMIN ORDINI</span></div></header><main class="co-main"><section id="admin-login" class="co-card admin-login"><span class="co-kicker">ACCESSO RISERVATO</span><h1 class="co-title" style="font-size:30px">Gestione ordini</h1><div class="co-field"><label for="admin-password">Password admin</label><input id="admin-password" type="password" autocomplete="current-password"></div><button id="admin-login-btn" class="co-primary" style="margin-top:15px">Accedi</button><div id="login-error" class="co-error"></div></section><section id="admin-app" class="co-card" hidden><div style="margin-bottom:20px"><span class="co-kicker">CONTROLLO ORDINI</span><h1 class="co-title" style="font-size:30px;margin-bottom:8px">Pagamenti e consegne</h1><p class="co-lead" style="margin-bottom:0">Conferma manualmente solo i pagamenti realmente ricevuti. Dopo la conferma, email e download protetto vengono generati automaticamente.</p></div><div class="admin-toolbar"><select id="filter-status"><option value="">Tutti gli stati</option><option>IN_ATTESA_PAGAMENTO</option><option>PAGAMENTO_DA_VERIFICARE</option><option>PAGATO</option><option>CONSEGNATO</option><option>ANNULLATO</option><option>RIMBORSATO</option></select><select id="filter-method"><option value="">Tutti i metodi</option><option value="paypal">PayPal</option><option value="bank">Bonifico</option></select><button id="refresh-orders" class="admin-btn primary">Aggiorna</button><span id="admin-note" class="admin-message"></span></div><div
